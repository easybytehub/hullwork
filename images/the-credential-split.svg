<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"
     role="img" aria-labelledby="title desc">
  <title id="title">The credential split: two programs, disjoint credentials</title>
  <desc id="desc">The receiver answers webhooks from the internet and holds a token that can file
    issues; it cannot push code and refuses to start if it finds a credential that can. The dispatcher
    holds the token that pushes one branch and listens on no port at all. The two never call each
    other: the only thing they share is one database. Nothing merges without a person.</desc>

  <!-- **Readable on a light or a dark page**, because GitHub renders this over whichever the reader
       chose and a diagram that is invisible in dark mode is worse than no diagram. The light values
       are the default rather than the override, so a viewer that ignores the media query below still
       gets a legible card instead of near-black on near-black.

       Colour marks the **guarantee**, never the capability, and every coloured line also says it in
       words — the interface document's rule, and red would be wrong here: in this product red means
       refused, and "cannot push" is the property being sold rather than a failure. -->
  <style>
    .bg    { fill: #fcfcfd; }
    .rule  { stroke: #9aa2ae; fill: none; stroke-width: 1.25; }
    .ink   { fill: #15171c; }
    .muted { fill: #5d6470; }
    .faint { fill: #868d99; }
    .ok    { fill: #12693a; }
    .arrow { fill: #5d6470; }
    text   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f1115; }
      .rule  { stroke: #3a4048; }
      .ink   { fill: #e7e9ee; }
      .muted { fill: #98a0ad; }
      .faint { fill: #6f7783; }
      .ok    { fill: #4fb37d; }
      .arrow { fill: #98a0ad; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="300"/>

  <g class="rule">
    <rect x="24" y="60" width="300" height="132" rx="4"/>
    <rect x="436" y="60" width="300" height="132" rx="4"/>
    <rect x="230" y="238" width="300" height="44" rx="4"/>
    <path d="M174 192 L174 238" stroke-dasharray="4 4"/>
    <path d="M586 192 L586 238" stroke-dasharray="4 4"/>
  </g>

  <text class="muted" x="24" y="30" font-size="13" letter-spacing="0.08em">THE INTERNET</text>
  <text class="faint mono" x="24" y="49" font-size="14">error tracker · a webhook · an attacker</text>
  <path class="arrow" d="M114 52 L120 60 L126 52"/>

  <text class="ink mono" x="44" y="88" font-size="16" font-weight="600">receiver</text>
  <text class="ink mono" x="456" y="88" font-size="16" font-weight="600">dispatcher</text>

  <g class="ink" font-size="14">
    <text x="44" y="114">answers webhooks · a port is open</text>
    <text x="44" y="138">holds a token that files issues</text>
    <text x="456" y="114">runs attempts · builds sandboxes</text>
    <text x="456" y="138">holds the token that pushes one branch</text>
  </g>

  <g class="ok" font-size="14" font-weight="600">
    <text x="44" y="162">CANNOT push code — guaranteed</text>
    <text x="456" y="162">LISTENS ON NOTHING — guaranteed</text>
  </g>

  <g class="muted" font-size="13">
    <text x="44" y="182">refuses to start if it finds a push token</text>
    <text x="456" y="182">no port, no route, nothing to reach</text>
  </g>

  <text class="faint" x="380" y="216" font-size="13" text-anchor="middle">
    no socket, no queue and no call between them
  </text>
  <text class="ink mono" x="380" y="266" font-size="14" text-anchor="middle">
    one database · the only thing they share
  </text>
</svg>
