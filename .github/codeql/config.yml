# What CodeQL analyses, and the one directory it does not.
#
# **Measured on the first run: 100 alerts, of which 3 were real.** The rest were one rule —
# `py/unused-global-variable` — firing 89 times on `migrations/versions/`, because every Alembic
# migration declares four module-level names its framework reads by name:
#
#     revision · down_revision · branch_labels · depends_on
#
# Nothing in the file uses them, and nothing should: Alembic imports the module and looks them up.
# So the rule is right about the code and wrong about the world, 89 times, growing by four with every
# migration this project ever writes.
#
# **The cost of this exclusion, stated rather than buried**: migrations are no longer analysed at all,
# and they do contain `op.execute()` with SQL of ours. That SQL is reviewed in the pull request that
# adds it, which is a person rather than a tool — a weaker guarantee, and the honest trade for a
# security tab where the one real finding is visible instead of ninetieth in a list.
#
# The three real ones the same rule found on the same run are worth recording, because they are the
# reason the quality suite stays on for everything else: `_PYTEST`, `_MAVEN_SELECTORS` and
# `_CABLE_PROGRAM` were all fossils of superseded designs, and two of them *contradicted* the comment
# beside the code that replaced them. In a codebase whose whole habit is explaining why, a tool found
# three explanations that had outlived their subject.
name: hullwork

paths-ignore:
  - migrations/versions

# Two rules excluded, each because its true-positive rate here is **zero for a structural reason** —
# measured on the first run, not assumed. Every exclusion below cost something, and the cost is named.
#
# `py/ineffectual-statement` — 31 alerts, **31 of them `...` in a `Protocol` body**, which is how a
# typed protocol method is declared in Python. Twenty-one are the `Forge` protocol alone. A rule that
# fires on every protocol in the codebase cannot be satisfied by a codebase that uses protocols, and
# this one uses them deliberately (`forge`, `tracker`, `gateway`). **Cost**: a genuinely pointless
# expression statement — `x == 1` where `x = 1` was meant — is no longer caught by anything. This
# comment first claimed `ruff`'s `B018` covered part of it; measured against that exact snippet with
# this project's configuration, it does not. An unverified mitigation in the file that justifies an
# exclusion is the worst place to put one.
#
# `py/implicit-string-concatenation-in-list` — 8 alerts, and the three sampled were all one long
# sentence wrapped at the line limit inside a list literal, which is this project's normal shape for
# prose that a person reads (a pull-request body, an agent brief, a shell command). The rule exists to
# catch a missing comma, and here the limit that forces the wrap and the rule that forbids it cannot
# both be satisfied. **Cost**: a real missing comma between two short strings in a list would now pass
# unnoticed, and nothing else checks for it.
query-filters:
  - exclude:
      id: py/ineffectual-statement
  - exclude:
      id: py/implicit-string-concatenation-in-list
