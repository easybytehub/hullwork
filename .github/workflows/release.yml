# What a tag produces, so that installing does not mean compiling.
#
# **The gap this closes.** Every way into Hullwork went through `git clone` and a build: the evaluation
# stack is `build: .`, and `hullwork try` needs `pip install -e .` from a checkout. That is several
# minutes and a toolchain before anybody has seen the product do anything, on a decision they have not
# made yet. Every self-hosted project people actually try — Uptime Kuma, Plausible, Forgejo, n8n — leads
# with a command that runs a *published artefact*. This is that.
#
# **Committed rather than generated, unlike the CI mirror.** Forgejo Actions also reads `.github/`, which
# is why `ci.yml` is written by the publish script instead of committed — a copy would run every job
# twice on the primary. This one carries a repository guard instead, so it is visible and reviewable in
# both places and executes in exactly one.
#
# **Three actions, and each one earns its place.** A release workflow is the worst place to widen a
# supply chain: it holds a token that can write packages and publish releases. `docker` and `gh` are on
# the runner, so the work itself needs nothing. What is here beyond `checkout` and `setup-python` is
# `attest-build-provenance`, which signs the wheel and the image through GitHub's own OIDC — the
# alternative being a signing key of ours to store, rotate and eventually leak. All pinned to full
# commit SHAs, which a test in `tests/` enforces across every workflow in the repository.
name: release

on:
  push:
    tags: ["v*"]

# **Read at the top, write on the job that needs it** — and this file scored **0/10** on Scorecard's
# Token-Permissions until it did. The rule is not decoration: a top-level `packages: write` is granted
# to *every* job in the file, including any future one that only needs to read, so the blast radius of
# a compromised step is the whole workflow rather than the step.
permissions:
  contents: read

jobs:
  publish:
    # The primary forge has neither this registry nor these credentials, and a tag pushed to both would
    # otherwise fail there on every release for no reason.
    if: github.repository == 'easybytehub/hullwork'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release, attach the wheel and its provenance
      packages: write      # push the image to ghcr.io
      # **Provenance, and the two permissions it needs.** Neither is a signing key: GitHub mints a
      # short-lived OIDC token for this run, signs with it, and records the attestation publicly. So
      # there is nothing to store, rotate or lose — and what the signature says is *which commit,
      # which workflow and which runner produced this artefact*, the only question a stranger pulling
      # our image can actually check.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }

      # **The tag is the version, and it has to agree with the package.** A release whose image says
      # 0.2.0 and whose wheel says 0.1.0 is unusable for anybody pinning either, and the failure shows
      # up months later in a bug report nobody can reproduce. Checked before anything is published.
      - name: The tag and `__version__` must agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c 'import hullwork; print(hullwork.__version__)')
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag is v$tagged and hullwork.__version__ is $declared."
            echo "Bump the package or move the tag; publishing them apart is worse than not publishing."
            exit 1
          fi
          echo "version=$tagged" >> "$GITHUB_OUTPUT"
          # **A prerelease must not become `latest`.** `0.1.0a1` is what this project is, and somebody
          # typing `docker pull …:latest` next year should not silently land on the first alpha ever
          # published. Only a plain `N.N.N` moves the moving tag.
          if printf '%s' "$tagged" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tagged is a prerelease: publishing the version tag only, not latest."
          fi
        id: version

      - name: Build the wheel
        run: |
          # Hash-pinned, because this workflow holds a token that can publish packages and create
          # releases — the worst place for "whatever PyPI served that minute". See requirements/.
          pip install --quiet --require-hashes -r requirements/build.txt
          python -m build --wheel

      - name: Push the image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STABLE: ${{ steps.version.outputs.stable }}
          # Through the environment rather than interpolated into the script, so the value cannot end
          # up in a shell trace or a log line. Empty when the secret is unset, which builds an image
          # that reports nowhere — the same as a checkout.
          UPSTREAM_DSN: ${{ secrets.UPSTREAM_DSN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}"
          tags=(--tag "$image:$VERSION")
          [ "$STABLE" = "true" ] && tags+=(--tag "$image:latest")
          # Both architectures: the sandbox image a project declares has to match the host's, and an
          # amd64-only publish quietly excludes every arm64 deployment.
          docker buildx create --use --name release
          # **Both extras, and their absence was a defect in 0.1.0a1** (item 150). `ARG EXTRAS=` is
          # empty by default, this line was missing, and the published image therefore had neither
          # `sentry-sdk` nor `psycopg`. Measured against the published artefact: with
          # `HULLWORK_ERROR_DSN` set it exited 3 telling the operator to run a `pip install` they
          # cannot run against an image they pulled, and a `postgresql://` URL died in a raw
          # SQLAlchemy traceback — while the README's support matrix said Postgres works. Two
          # capabilities documented in three places each, impossible in the thing we ship.
          # **The destination, and it exists only here** (item 152). The repository contains no DSN —
          # `test_no_destination_is_hidden_in_the_source_tree` fails if one appears — so a build made
          # from a checkout reports nowhere, and the artefact we publish reports the defects it hits
          # on other people's installations. An unset secret leaves it empty, which is the same as a
          # checkout: no destination, no reporting, no code path taken.
          #
          # What travels is constructed, not filtered: see `hullwork/upstream.py`. The key is a
          # public write-only DSN, so its presence in the image is expected rather than a leak.
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg EXTRAS='[postgres,telemetry]' \
            --build-arg UPSTREAM_DSN="${UPSTREAM_DSN}" "${tags[@]}" \
            --metadata-file metadata.json --push .
          # The digest of what was actually pushed, read from the build rather than guessed by
          # inspecting the tag afterwards: a tag can move between the push and the read, and then the
          # attestation would describe something other than what shipped.
          digest=$(python -c "import json; print(json.load(open('metadata.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      # **Provenance for both artefacts, before the release exists.** In this order on purpose: an
      # attestation that arrives after the release is one that somebody could have downloaded without.
      # **The bundle is attached to the release, and that is the whole point of `id: provenance`.**
      # Scorecard's Signed-Releases scored **0/10** with the attestations already in place, because it
      # reads a release's *assets* — and GitHub stores attestations out of band, where a tool looking
      # at the release cannot see them. So the same signature travels twice: in GitHub's own
      # attestation store, and as a file anybody can check without trusting this repository's API.
      - name: Attest the wheel
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*.whl

      - name: Attest the image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          # Stored beside the image in the registry, so `gh attestation verify oci://…` works for
          # somebody who has the image and not this repository.
          push-to-registry: true

      # `--verify-tag` so a release cannot be created for a tag that was deleted between the push and
      # this step, and `--notes-from-tag` because the annotation is where the notes belong: it travels
      # with the tag rather than living only in a web form.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ steps.version.outputs.stable }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag)
          [ "$STABLE" = "true" ] || flags+=(--prerelease)
          # The provenance beside the wheel, named so it is obvious what it is.
          cp "$PROVENANCE" "dist/$GITHUB_REF_NAME.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.whl dist/*.intoto.jsonl
