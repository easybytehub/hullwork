# The score, from the tool rather than from us.
#
# **This exists because reading the checks and grading yourself does not work.** On 2026-08-06 this
# repository's rules were rewritten against Scorecard's own list, and my reading of where we stood was
# written down as a table. Then the tool ran: **5.7/10**, and it disagreed in two places I had marked
# as done — Token-Permissions at **0/10** because two workflows declared `write` at the top level
# rather than per job, and Signed-Releases at **0/10** because it reads a release's *assets* and
# GitHub stores attestations out of band, where a tool looking at the release cannot see them.
#
# Both are fixed. What is kept is the habit: the number comes from something we do not control, on a
# schedule, whether or not anybody remembers to ask.
#
# The score is published to the OpenSSF's public API — the point of `publish_results`, since a score
# only we can read is a claim again.
#
# **What it deliberately does NOT do is upload its findings to code scanning**, and that is a
# correction. The first version did, and the security tab then listed six permanent entries —
# `BranchProtectionID`, `CodeReviewID`, `MaintainedID`, `FuzzingID`, `CIIBestPracticesID`,
# `PinnedDependenciesID` — which are not defects in the code. They are the policy scores this project
# already documents in `docs/releasing.md`, several of them unfixable by design: `Maintained` measures
# the repository's age, `CodeReview` measures a decision about approvals we made on purpose.
#
# Mixing them in there cost something real: a genuine `error`-level CodeQL finding sat in a list of a
# hundred entries, ninety-eight of which nobody could act on. A security tab that cannot be emptied is
# a security tab nobody reads.
name: scorecard

on:
  # A pull request cannot run this: the analysis needs a token with repository metadata and the
  # results are about the repository's *settings*, which a branch cannot change. So: on `main`, and
  # weekly, because the checks themselves improve without this repository changing.
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    if: github.repository == 'easybytehub/hullwork'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What `publish_results` signs with. No key of ours, same as the release attestations.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Public, deliberately. The score is a claim about this repository that somebody else
          # computed, and the only version of that worth having is the one anybody can look up.
          publish_results: true

      # The SARIF is kept as a run artefact rather than uploaded: readable when somebody wants the
      # detail, and not sitting permanently in the tab meant for code defects.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
